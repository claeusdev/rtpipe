[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-time-pipeline"
version = "0.1.0"
description = "High-performance real-time market data processing system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jump Trading", email = "dev@jumptrading.com"},
]
keywords = ["market-data", "real-time", "trading", "kafka", "websocket"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core dependencies
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    
    # Data processing
    "pandas==2.1.4",
    "numpy==1.25.2",
    "python-dateutil==2.8.2",
    
    # Async and WebSocket
    "websockets==12.0",
    "aiohttp==3.9.1",
    "aiofiles==23.2.1",
    
    # Message queue and streaming
    "kafka-python==2.0.2",
    "aiokafka==0.10.0",
    
    # Databases
    "redis==5.0.1",
    "influxdb-client==1.39.0",
    "asyncpg==0.29.0",
    
    # Monitoring and metrics
    "prometheus-client==0.19.0",
    "structlog==23.2.0",
    
    # Configuration
    "PyYAML==6.0.1",
    "python-dotenv==1.0.0",
    
    # WebSocket clients for exchanges
    "python-binance==1.0.19",
    "cbpro==1.1.4",
    "krakenex==2.2.2",
    
    # Utilities
    "python-multipart==0.0.6",
    "requests==2.31.0",
    
    # Performance
    "ujson==5.8.0",
    "orjson==3.9.10",
    "cython==3.0.6",
]

[project.optional-dependencies]
test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-mock==3.12.0",
    "httpx==0.25.2",
]

dev = [
    "black==23.11.0",
    "isort==5.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
]

all = [
    "real-time-pipeline[test,dev]",
]

[project.urls]
Homepage = "https://github.com/jumptrading/real-time-pipeline"
Repository = "https://github.com/jumptrading/real-time-pipeline"
Documentation = "https://github.com/jumptrading/real-time-pipeline#readme"
Issues = "https://github.com/jumptrading/real-time-pipeline/issues"

[project.scripts]
pipeline = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-mock==3.12.0",
    "httpx==0.25.2",
    "black==23.11.0",
    "isort==5.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
