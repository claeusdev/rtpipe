# Real-Time Market Data Pipeline Configuration

# Application settings
app:
  name: "market-data-pipeline"
  version: "1.0.0"
  debug: false
  log_level: "INFO"

# API Server configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

# Kafka configuration
kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    trades: "market.trades"
    quotes: "market.quotes" 
    orderbook: "market.orderbook"
    aggregated: "market.aggregated"
  consumer_group: "market-data-processor"
  auto_offset_reset: "latest"
  enable_auto_commit: true
  auto_commit_interval_ms: 1000
  max_poll_records: 1000
  fetch_min_bytes: 1
  fetch_max_wait_ms: 500

# Redis configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""  # Empty string for no password
  max_connections: 100
  socket_timeout: 1.0
  socket_connect_timeout: 1.0
  ttl:
    trades: 3600  # 1 hour
    quotes: 1800  # 30 minutes
    orderbook: 600  # 10 minutes

# InfluxDB configuration
influxdb:
  url: "http://localhost:8086"
  token: "my-super-secret-auth-token"
  org: "jumptrading"
  bucket: "marketdata"
  timeout: 10000
  batch_size: 5000
  flush_interval: 1000  # milliseconds

# Exchange configurations
exchanges:
  binance:
    enabled: true
    websocket_url: "wss://stream.binance.com:9443/ws"
    rest_url: "https://api.binance.com"
    symbols: ["BTCUSDT", "ETHUSDT", "ADAUSDT", "DOTUSDT", "LINKUSDT"]
    streams: ["trade", "depth@100ms", "ticker"]
    reconnect_interval: 5
    heartbeat_interval: 30
    
  coinbase:
    enabled: true
    websocket_url: "wss://ws-feed.pro.coinbase.com"
    rest_url: "https://api.pro.coinbase.com"
    symbols: ["BTC-USD", "ETH-USD", "ADA-USD", "DOT-USD", "LINK-USD"]
    channels: ["trades", "level2", "ticker"]
    reconnect_interval: 5
    heartbeat_interval: 30
    
  kraken:
    enabled: false  # Enable when needed
    websocket_url: "wss://ws.kraken.com"
    rest_url: "https://api.kraken.com"
    symbols: ["BTC/USD", "ETH/USD"]
    subscriptions: ["trade", "book", "ticker"]
    reconnect_interval: 5

# Data processing configuration
processing:
  batch_size: 1000
  flush_interval: 100  # milliseconds
  max_latency: 1000  # microseconds
  enable_deduplication: true
  enable_validation: true
  enable_enrichment: true
  
  # Order book settings
  orderbook:
    depth_levels: 20
    update_frequency: 100  # milliseconds
    snapshot_interval: 5000  # milliseconds
    
  # Trade aggregation
  aggregation:
    intervals: [1, 5, 15, 30, 60]  # seconds
    enable_vwap: true
    enable_volume_profile: true

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    port: 8001
    path: "/metrics"
    
  metrics:
    - "messages_processed_total"
    - "processing_latency_seconds"
    - "error_count_total"
    - "connection_status"
    - "queue_depth"
    - "memory_usage_bytes"
    - "cpu_usage_percent"
    
  alerts:
    high_latency_threshold: 0.001  # 1ms
    error_rate_threshold: 0.01     # 1%
    queue_depth_threshold: 10000
    memory_threshold: 0.8          # 80%
    cpu_threshold: 0.8             # 80%

# Logging configuration
logging:
  level: "INFO"
  format: "json"
  file: "logs/pipeline.log"
  max_size: "100MB"
  max_files: 10
  
  loggers:
    kafka: "WARNING"
    websockets: "WARNING"
    asyncio: "WARNING"

# Performance tuning
performance:
  async:
    max_workers: 100
    connection_pool_size: 50
    connection_timeout: 30
    
  memory:
    gc_threshold: 100000
    max_cache_size: 1000000
    
  network:
    tcp_nodelay: true
    tcp_keepalive: true
    buffer_size: 65536

# Security settings
security:
  api_key_header: "X-API-Key"
  rate_limit:
    enabled: true
    requests_per_minute: 1000
    
  cors:
    enabled: true
    origins: ["*"]
    methods: ["GET", "POST"]
    headers: ["*"]

# Development settings
development:
  mock_data: false
  data_replay: false
  replay_speed: 1.0
  test_symbols: ["BTCUSDT"]